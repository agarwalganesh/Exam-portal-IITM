{% extends 'base.html' %}

{% block title %}Login - Examination Management Portal{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
        <i class="bi bi-shield-lock-fill fs-2 text-primary"></i>
      </div>
      <h3 class="fw-bold mb-1">Portal Login</h3>
      <p class="text-muted small">Sign in to your Examination Management account</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="username@gmail.com" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-key"></i></span>
          <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-emp-primary w-100 py-2 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
      </button>
    </form>

    <div class="mt-4 pt-3 border-top text-center">
      <p class="small text-muted mb-2">Don't have an account?</p>
      <div class="d-flex justify-content-center gap-2">
        <a href="{{ url_for('auth.register_student') }}" class="btn btn-sm btn-outline-success">
          <i class="bi bi-person-plus me-1"></i> Student Registration
        </a>
        <a href="{{ url_for('auth.register_examiner') }}" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-person-badge me-1"></i> Examiner Registration
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
